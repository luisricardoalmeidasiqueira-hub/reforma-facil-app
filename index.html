<style>
/* Layout: app de uma coluna, cabeçalho em azul jeans com fita métrica, navegação fixa embaixo */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --ink:#1b2333; --muted:#5d6779; --line:#dde2ec;
  --denim:#2c4a7c; --denim-ink:#ffffff; --tape:#f2c230; --tape-ink:#2a2208;
  --ok:#1f8a4c; --warn:#d9822b; --bad:#c9372c; --soft:#e8eef8; --link:#2c4a7c;
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141c; --surface:#1a202b; --ink:#e8ecf3; --muted:#9aa4b6; --line:#2b3342;
  --denim:#2a4573; --denim-ink:#ffffff; --tape:#f2c230; --tape-ink:#2a2208;
  --ok:#3fbf73; --warn:#f0a050; --bad:#ef6a5e; --soft:#222b3a; --link:#8fb3ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141c; --surface:#1a202b; --ink:#e8ecf3; --muted:#9aa4b6; --line:#2b3342;
  --denim:#2a4573; --denim-ink:#ffffff; --tape:#f2c230; --tape-ink:#2a2208;
  --ok:#3fbf73; --warn:#f0a050; --bad:#ef6a5e; --soft:#222b3a; --link:#8fb3ff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--denim);color:var(--denim-ink);padding-block:18px 0}
header.top h1{font-family:var(--display);font-weight:800;font-size:26px;margin:0;letter-spacing:-.01em}
header.top p{margin:2px 0 12px;opacity:.85;font-size:13px}
.tape{height:22px;background:var(--tape);background-image:repeating-linear-gradient(90deg,var(--tape-ink) 0 1px,transparent 1px 10px),repeating-linear-gradient(90deg,var(--tape-ink) 0 1.5px,transparent 1.5px 50px);background-size:100% 6px,100% 11px;background-repeat:no-repeat;background-position:0 0,0 0;position:relative}
.tape span{position:absolute;bottom:2px;font:600 9px var(--body);color:var(--tape-ink)}
main{padding-block:16px 90px;display:grid;gap:16px}
.origens{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--surface);border-bottom:1px solid var(--line)}
.origens .wrap{display:flex;gap:6px;padding-block:10px;overflow-x:auto}
.origens .wrap button{flex:1 0 auto;min-width:84px}
.origens .wrap button.edit{flex:0 0 auto;min-width:0;background:var(--soft);border-color:var(--soft)}
.origens button{position:relative;border-radius:10px;padding:10px 6px;font-size:15px}
.origens button.on{background:var(--denim);color:var(--denim-ink);border-color:var(--denim)}
.origens .dot{top:4px;left:auto;right:6px;border-color:var(--surface)}
.tag.org{background:var(--denim);color:var(--denim-ink)}
h2{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.ped{border-left:4px solid var(--line)}
.ped.s-recebido{border-left-color:var(--muted)} .ped.s-costura{border-left-color:var(--warn)}
.ped.s-pronto{border-left-color:var(--ok)} .ped.s-entregue{border-left-color:var(--line);opacity:.75}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.row > *{min-width:0}
.nome{font-weight:700;font-size:16px}
.sub{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--ink);white-space:nowrap}
.pill.recebido{color:var(--muted)} .pill.costura{color:var(--warn)} .pill.pronto{color:var(--ok)} .pill.atraso{background:var(--bad);color:#fff}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;background:var(--soft);padding:3px 8px;border-radius:6px}
.money{font-variant-numeric:tabular-nums;font-weight:700}
.falta{color:var(--bad);font-weight:600;font-size:13px}
button,.btn{font:600 14px var(--body);border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--tape);outline-offset:2px}
.primary{background:var(--denim);color:var(--denim-ink);border-color:var(--denim)}
.zap{background:var(--ok);color:#fff;border-color:var(--ok)}
.danger{color:var(--bad)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts > *{flex:1 1 auto}
.acts > .lixo{flex:0 0 auto;padding:9px 11px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{border-radius:99px;padding:6px 14px;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{width:100%;font:15px var(--body);padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.field{display:grid;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc{display:flex;flex-wrap:wrap;gap:6px}
.svc button{font-weight:500;font-size:13px;padding:7px 10px}
.svc button.on{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.total{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:10px;padding:10px 12px}
.total b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
nav.bar button{border:0;border-radius:0;background:none;flex-direction:column;gap:2px;font-size:11px;padding:8px 0 10px;color:var(--muted);position:relative}
nav.bar button.on{color:var(--denim)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.bar button.on{color:var(--tape)}}
:root[data-theme="dark"] nav.bar button.on{color:var(--tape)}
nav.bar svg{width:22px;height:22px}
.dot{position:absolute;top:6px;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--warn);border:2px solid var(--surface)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));height:54px;padding:0 20px;border-radius:99px;background:var(--tape);color:var(--tape-ink);border:0;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
.sheet{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding-block:16px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:12px}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.svcrow{display:grid;grid-template-columns:1fr 92px 40px;gap:8px;align-items:center}
.svcrow input{padding:8px 10px}
.legend{display:grid;gap:6px;font-size:14px}
.legend span{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
header.top .row{align-items:flex-start}
.ajuda{background:var(--tape);color:var(--tape-ink);border:0;margin-top:4px;font-size:13px}
.dica{background:var(--soft);border:1px dashed var(--denim);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14px}
.dica p{margin:4px 0 0}
.dica button{justify-self:start;font-size:13px;padding:6px 10px}
.hint{color:var(--muted);font-size:12.5px;margin:0}
.svccard{gap:10px}
.svcline{display:flex;gap:8px;align-items:center}
.svcline .preco{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.svcline .preco span{font-weight:700;color:var(--muted)}
.salvar{white-space:nowrap}
.salvar.pend{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.card.novo{border:2px solid var(--denim)}
.tour{text-align:center;gap:14px}
.tour p{margin:0;font-size:16px;line-height:1.55}
.tour h2{font-size:24px}
.bolas{display:flex;justify-content:center;gap:6px}
.bolas i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.bolas i.on{background:var(--denim);width:22px;border-radius:4px}
.pular{border:0;background:none;color:var(--muted);font-size:13px}
.mes{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.mes b{font-family:var(--display);font-size:17px}
.mes button{border:0;font-size:16px}
.cxl{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-variant-numeric:tabular-nums}
.cxl b{font-size:18px}
.cxl.sub2{font-size:13px;color:var(--muted);padding-left:22px}
.cxl.final{border-top:2px solid var(--line);padding-top:10px;margin-top:4px}
.cxl.final b{font-family:var(--display);font-size:26px}
.cxl.final.bom b{color:var(--ok)} .cxl.final.ruim b{color:var(--bad)}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.modos{display:grid;gap:8px}
.modos button{flex-direction:column;padding:14px 8px;font-size:16px;border-width:2px}
.modos button small{font-weight:500;color:var(--muted);font-size:12px}
.modos button.on{border-color:var(--denim);background:var(--soft)}
.svc button.on{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.ped.s-cancelado{opacity:.6}
.pill.cancelado{color:var(--bad)}
.diahead{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center}
.diahead h2{font-size:24px}
.diahead button,.pernav button{width:44px;height:44px;border-radius:50%;font-size:22px;flex:0 0 auto;background:var(--soft);border:0}
.pernav{display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:center;padding-bottom:8px;border-bottom:1px solid var(--line)}
.pernav b{font-family:var(--display);font-size:16px}
.per .cxl{padding-block:6px;border-bottom:1px solid var(--line)}
.per .cxl.final{border-bottom:0}
.link{border:0;background:none;color:var(--link);text-decoration:underline;padding:0;font-size:13px;font-weight:700;display:inline}
.stat .link{margin-top:6px}
.reschips{display:flex;gap:6px;margin-top:8px}
.reschips button{flex:1;padding:6px 0;font-size:13px}
.reschips button.on{background:var(--tape);color:var(--tape-ink);border-color:var(--tape)}
.fica{display:block;margin-top:6px;font-size:12.5px;font-weight:700;color:var(--ok)}
.cent{text-align:center}
.bigred{width:100%;background:var(--bad);color:#fff;border:0;font-size:18px;padding:14px;flex-direction:column;gap:2px}
.bigred small{font-weight:500;font-size:12.5px;opacity:.9}
.big2{width:100%;padding:14px;font-size:16px}
.stat.tap{width:100%;text-align:left;display:block;font:inherit;color:inherit}
.stat b.neg,.stat b.pos{font-size:19px}
.pick{width:100%;flex-direction:column;align-items:flex-start;padding:12px;text-align:left}
.pc p{margin:0;font-size:15px}
.aviso{background:var(--soft);border-radius:10px;padding:10px;font-size:14px;border-left:4px solid var(--warn)}
.pixbox{background:var(--soft);border-radius:12px;padding:12px;display:grid;gap:8px;justify-items:center;text-align:center}
.pixbox p{margin:0}
.pixchave{word-break:break-all}
.qr{background:#ffffff;padding:10px;border-radius:10px;color:#1b2333;min-height:20px}
.qr img,.qr canvas{display:block}
.stats.tres{grid-template-columns:repeat(3,1fr)}
.stats.tres b{font-size:17px}
.est .edit{border:0;background:var(--soft);padding:6px 10px}
.est.pouco{border-color:var(--warn)}
.dotin{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--warn);margin-left:8px;vertical-align:2px}
.tem{font-size:15px}
.acab{color:var(--warn);font-weight:600}
.usei{background:var(--bad);color:#fff;border-color:var(--bad);font-size:16px;padding:12px}
.comprei{background:var(--ok);color:#fff;border-color:var(--ok);font-size:16px;padding:12px}
.stepper{display:grid;grid-template-columns:64px 1fr 64px;gap:8px}
.stepper button{font-size:28px;padding:6px 0;background:var(--soft)}
.stepper input{text-align:center;font-size:24px;font-weight:700}
.check{display:flex;gap:10px;align-items:center;font-size:15px}
.check input{width:22px;height:22px}
.perfil{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.perfil .foto{position:relative;width:64px;height:64px;padding:0;border-radius:50%;border:3px solid var(--tape);background:var(--soft);flex:0 0 auto}
.perfil .foto img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.perfil .cam{position:absolute;right:-6px;bottom:-4px;background:var(--tape);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:13px;line-height:1}
.olanome{display:block;background:none;border:0;color:var(--denim-ink);font-size:18px;padding:4px 0;text-align:left;min-width:0}
.olanome b{font-family:var(--display);font-size:20px}
.lapis{font-size:15px;background:rgba(255,255,255,.18);border-radius:8px;padding:2px 6px;margin-left:4px}
.fotogrande{display:grid;place-items:center}
.fotogrande img{width:160px;height:160px;border-radius:50%;object-fit:cover;border:4px solid var(--tape)}
label.btn{cursor:pointer}
footer{text-align:center;color:var(--muted);font-size:12.5px;margin-block:8px 90px;padding:14px 12px;display:grid;gap:4px;border-top:2px solid var(--line)}
footer b{color:var(--ink)}
.fapp{font-family:var(--display);font-weight:600;font-size:14px;color:var(--ink)}
.ajudas{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.barra{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.barra i{display:block;height:100%;background:var(--ok);border-radius:99px}
.licao{width:100%;display:flex;align-items:center;gap:12px;justify-content:flex-start;text-align:left;padding:12px;font-size:15px}
.licao .lic-ic{font-size:22px}
.licao .lic-t{flex:1;min-width:0}
.licao.ok{border-color:var(--ok)}
.passos{display:grid;gap:10px;font-size:16px;line-height:1.5}
.passos p{margin:0}
.grande{font-size:18px;padding:14px;width:100%}
.alvo{outline:4px solid var(--tape)!important;outline-offset:4px;border-radius:12px}
@media (prefers-reduced-motion: no-preference){.alvo{animation:pisca 1.1s ease-in-out infinite}@keyframes pisca{50%{outline-color:transparent}}}
.guia{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));top:calc(10px + env(safe-area-inset-top,0px));z-index:15;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px;display:grid;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:540px;margin:0 auto;font-size:16px}
.guia button{font-size:14px}
.guia.baixo{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20}
.ex{font-size:10px;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:2px}
@media (prefers-reduced-motion: no-preference){.sheet .box{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

<button class="fab" id="fab">+ Novo pedido</button>

<nav class="bar" id="nav">
  <button data-t="inicio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Início</button>
  <button data-t="pedidos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3h8l1 4H7z"/><path d="M7 7l-2 14h14L17 7"/></svg>Pedidos</button>
  <button data-t="servicos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.5L20 18M8.5 16.5L20 6"/></svg>Serviços</button>
  <button data-t="estoque"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Estoque</button>
  <button data-t="caixa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Caixa</button>
  <button data-t="mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Mais</button>

<div id="modal"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const VERSAO="1.0";
const KEY="reforma_facil_v1";
const STATUS=[["recebido","Recebido"],["costura","Em costura"],["pronto","Pronto"],["entregue","Entregue"],["cancelado","Cancelado"]];
const PECAS=["Calça","Calça jeans","Bermuda","Saia","Vestido","Camisa","Camiseta","Blusa","Jaqueta","Terno/Blazer","Cortina","Outro"];
const SERV_PADRAO=[
 ["Barra de calça",20],["Barra italiana",25],["Barra original (jeans)",25],["Apertar cintura",25],
 ["Soltar cintura",25],["Ajustar laterais",30],["Afunilar perna",30],["Encurtar manga",20],
 ["Trocar zíper",25],["Troca de zíper (jaqueta forrada)",45],["Troca de elástico",20],["Pregar botão",5],["Cerzir / remendo",15],["Ajustar alça",15]];

function hojeISO(d=0){const t=new Date();t.setDate(t.getDate()+d);return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0")}
function exemplo(){
 return {servicos:SERV_PADRAO.map(([n,p])=>({nome:n,preco:p})),pedidos:[]};
}
let D;
try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
if(!D||!D.pedidos)D=exemplo();
// atualização 1.1: barra de calça a R$ 20 e novos serviços, sem apagar o que já existe
if(!D.gastos){D.gastos=[];try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
if(!D.v16){
 D.pedidos.forEach(p=>{if(!p.pagamentos){const v=+p.sinal||0;p.pagamentos=v>0?[{data:p.status==="entregue"?(p.entregueEm||p.entrega||p.entrada):p.entrada,valor:v,forma:p.status==="entregue"?"Pagou":"Sinal"}]:[]}
  if(p.ex&&p.id===1&&!p.vencePag)p.vencePag=hojeISO(3)});
 D.v16=1;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
}
if(!D.v13){
 const ex={1:"loja",2:"carrocao",3:"loja",4:"carrocao"};
 D.pedidos.forEach(p=>{if(!p.origem)p.origem=(p.ex&&ex[p.id])||"loja"});
 D.v13=1;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
}
if(!D.v11){
 const b=D.servicos.find(s=>s.nome==="Barra simples");if(b){b.nome="Barra de calça";b.preco=20}
 [["Troca de zíper (jaqueta forrada)",45],["Troca de elástico",20]].forEach(([n,p])=>{if(!D.servicos.some(s=>s.nome===n))D.servicos.push({nome:n,preco:p})});
 if(!D.servicos.some(s=>s.nome==="Barra de calça"))D.servicos.unshift({nome:"Barra de calça",preco:20});
 D.v11=1;try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}
}
function salvar(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}

let aba="inicio",filtro="abertos",busca="",origem="todos";
try{aba=localStorage.getItem(KEY+"_aba")||"inicio";origem=localStorage.getItem(KEY+"_org")||"todos"}catch(e){}
if(!D.origens){D.origens=[{id:"loja",nome:"Loja"},{id:"carrocao",nome:"Carroção"},{id:"particular",nome:"Particular"}];try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
const origens=()=>D.origens.map(o=>[o.id,o.nome]);
const orgNome=k=>(origens().find(o=>o[0]===k)||["","—"])[1];
function editarOrigens(){
 folha("✏️ Lugares dos pedidos",`<p class="hint">Aqui você muda os nomes lá de cima.<br>Escreva o nome novo e toque em <b>💾 Salvar</b>.</p>
 ${D.origens.map((o,i)=>{const usa=D.pedidos.some(p=>p.origem===o.id);return `<div class="card svccard">
  <div class="svcline"><input id="og${i}" value="${esc(o.nome)}" aria-label="Nome do lugar">
  <button class="salvar" onclick="salvaOrigem(${i})">💾 Salvar</button>
  <button class="lixo danger" aria-label="Apagar lugar" onclick="${usa?`toast('Tem pedidos aqui. Mude os pedidos antes de apagar.')`:`$('#ox${i}').innerHTML='<div class=&quot;acts&quot;><button class=&quot;danger&quot; onclick=&quot;apagaOrigem(${i})&quot;>Sim, apagar</button><button onclick=&quot;editarOrigens()&quot;>Cancelar</button></div>'`}">${LIXO}</button></div><div id="ox${i}"></div></div>`}).join("")}
 <div class="card novo"><span class="lbl">Lugar novo</span>
  <input id="og_novo" placeholder="Ex.: Cliente Maria, Loja do centro">
  <button class="primary" onclick="novaOrigem()">💾 Salvar lugar novo</button></div>`);
}
function salvaOrigem(i){const n=$("#og"+i).value.trim();if(!n){toast("Escreva um nome");return}D.origens[i].nome=n;salvar();render();editarOrigens();toast("Nome salvo ✔")}
function novaOrigem(){const n=$("#og_novo").value.trim();if(!n){toast("Escreva o nome do lugar");return}D.origens.push({id:"o"+Date.now(),nome:n});salvar();render();editarOrigens();toast("Lugar criado ✔")}
function apagaOrigem(i){const id=D.origens[i].id;D.origens.splice(i,1);if(origem===id)origem="todos";salvar();render();editarOrigens();toast("Lugar apagado")}
const porOrigem=p=>origem==="todos"||p.origem===origem;
function escolheOrigem(k){origem=k;try{localStorage.setItem(KEY+"_org",k)}catch(e){};render()}

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=v=>"R$ "+(Number(v)||0).toFixed(2).replace(".",",");
const dm=iso=>iso?iso.split("-").reverse().slice(0,2).join("/"):"—";
const stNome=s=>(STATUS.find(x=>x[0]===s)||["",s])[1];
const atrasado=p=>p.entrega&&p.entrega<hojeISO()&&(p.status==="recebido"||p.status==="costura");
const aberto=p=>p.status!=="entregue"&&p.status!=="cancelado";

function toast(t){const el=document.createElement("div");el.className="toast";el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),2200)}

function cardPedido(p){
 const falta=(+p.valor||0)-(+p.sinal||0);
 const quando=p.entrega===hojeISO()?"Entrega hoje":p.entrega===hojeISO(1)?"Entrega amanhã":"Entrega "+dm(p.entrega);
 return `<div class="card ped s-${p.status}">
  <div class="row"><div class="nome">${esc(p.cliente)}${p.ex?'<span class="ex">EXEMPLO</span>':""}</div>
   ${atrasado(p)?'<span class="pill atraso">Atrasado</span>':`<span class="pill ${p.status}">${stNome(p.status)}</span>`}</div>
  <div class="sub">${origem==="todos"?`<span class="tag org">${orgNome(p.origem)}</span> `:""}${esc(p.peca)} · ${quando}</div>
  <div class="tags">${p.servicos.map(s=>`<span class="tag">${esc(s.nome)}</span>`).join("")}</div>
  ${p.medidas?`<div class="sub">📏 ${esc(p.medidas)}</div>`:""}
  <div class="row"><span class="money">${brl(p.valor)}</span>${falta>0?`<span class="falta">Falta receber ${brl(falta)}</span>`:'<span class="sub">Pago</span>'}</div>
  ${falta>0&&p.vencePag?`<div class="sub">Vai pagar até ${dm(p.vencePag)}</div>`:""}
  <div class="acts" id="acts${p.id}">
   ${p.status!=="entregue"&&p.status!=="cancelado"?`<button class="primary" onclick="avancar(${p.id})">${p.status==="pronto"?"Marcar entregue":p.status==="costura"?"Marcar pronto":"Começar costura"}</button>`:""}
   ${falta>0?`<button class="btnrec" onclick="abrirPag(${p.id})">💵 Receber</button>`:""}
   ${p.status==="pronto"&&p.fone?`<a class="btn zap" target="_blank" rel="noopener" href="${linkZap(p)}">Avisar no WhatsApp</a>`:""}
   <button onclick="abrirForm(${p.id})">Editar</button>
   <button class="lixo danger" aria-label="Excluir pedido" onclick="pedirExcluir(${p.id})"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
  </div></div>`;
}
function linkZap(p){
 let n=String(p.fone).replace(/\D/g,"");if(n.length<=11)n="55"+n;
 const falta=(+p.valor||0)-(+p.sinal||0);
 const msg=`Olá, ${p.cliente}! Sua ${p.peca.toLowerCase()} já está pronta para retirar. 😊`+(falta>0?` Valor a pagar: ${brl(falta)}.`:"")+` Obrigada pela preferência!`+(temPix()?` Pix: ${D.pix.chave}`:"");
 return "https://wa.me/"+n+"?text="+encodeURIComponent(msg);
}

function telaInicio(){
 const base=D.pedidos.filter(porOrigem);
 const ab=base.filter(aberto);
 const receber=ab.reduce((s,p)=>s+((+p.valor||0)-(+p.sinal||0)),0);
 const mes=hojeISO().slice(0,7);
 const fatMes=base.filter(p=>p.entrada&&p.entrada.startsWith(mes)).reduce((s,p)=>s+(+p.valor||0),0);
 const prox=ab.filter(p=>p.status!=="pronto"&&p.entrega&&p.entrega<=hojeISO(2)).sort((a,b)=>a.entrega.localeCompare(b.entrega));
 const prontos=ab.filter(p=>p.status==="pronto");
 return dica("inicio")+`<div class="stats">
  <div class="stat"><span class="lbl">Na fila</span><b>${ab.filter(p=>p.status!=="pronto").length}</b></div>
  <div class="stat"><span class="lbl">Prontos p/ retirar</span><b>${prontos.length}</b></div>
  <div class="stat"><span class="lbl">A receber</span><b>${brl(receber)}</b></div>
  <div class="stat"><span class="lbl">Entradas no mês</span><b>${brl(fatMes)}</b></div></div>
 <h2>Para entregar logo</h2>
 ${prox.length?prox.map(cardPedido).join(""):'<div class="card empty">Nada vencendo nos próximos dias.</div>'}
 <h2>Prontos, esperando o cliente</h2>
 ${prontos.length?prontos.map(cardPedido).join(""):'<div class="card empty">Nenhuma peça pronta parada.</div>'}`;
}

function telaPedidos(){
 const f={todos:()=>true,abertos:p=>p.status==="recebido"||p.status==="costura",prontos:p=>p.status==="pronto",entregues:p=>p.status==="entregue"};
 const q=busca.toLowerCase();
 const lista=D.pedidos.filter(porOrigem).filter(f[filtro]).filter(p=>!q||(p.cliente+" "+p.peca+" "+p.fone).toLowerCase().includes(q))
  .sort((a,b)=>(a.entrega||"9").localeCompare(b.entrega||"9"));
 return dica("pedidos")+`<h2>Pedidos</h2>
 <input id="busca" placeholder="Buscar cliente, peça ou telefone" value="${esc(busca)}" oninput="busca=this.value;render(true)">
 <div class="chips">${[["abertos","Em aberto"],["prontos","Prontos"],["entregues","Entregues"],["todos","Todos"]].map(([k,n])=>`<button class="chip ${filtro===k?"on":""}" onclick="filtro='${k}';render()">${n}</button>`).join("")}</div>
 ${lista.length?lista.map(cardPedido).join(""):'<div class="card empty">Nenhum pedido aqui. Toque no botão amarelo + Novo pedido para anotar uma peça.</div>'}`;
}

const LIXO='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
function telaServicos(){
 return dica("servicos")+`<h2>Tabela de serviços</h2>
 <div class="card novo">
  <span class="lbl">Cadastrar serviço novo</span>
  <input id="nv_n" placeholder="Nome do serviço (ex.: Barra de cortina)">
  <div class="svcline"><div class="preco"><span>R$</span><input id="nv_p" type="number" inputmode="decimal" placeholder="0"></div>
   <button class="primary" onclick="novoSvc()">💾 Salvar</button></div>
 </div>
 <span class="lbl">Serviços já cadastrados</span>
 ${D.servicos.map((s,i)=>`<div class="card svccard">
  <input id="sn${i}" value="${esc(s.nome)}" oninput="mudou(${i})" aria-label="Nome do serviço">
  <div class="svcline"><div class="preco"><span>R$</span><input id="sp${i}" type="number" inputmode="decimal" value="${s.preco}" oninput="mudou(${i})" aria-label="Preço"></div>
   <button class="salvar" id="sv${i}" onclick="salvaSvc(${i})">💾 Salvar</button>
   <button class="lixo danger" aria-label="Apagar serviço" onclick="pedeExcluirSvc(${i})">${LIXO}</button></div>
  <div id="sx${i}"></div></div>`).join("")}`;
}
function mudou(i){const b=$("#sv"+i);b.classList.add("pend");b.textContent="💾 Salvar mudança"}
function salvaSvc(i){
 const n=$("#sn"+i).value.trim();if(!n){toast("Escreva o nome do serviço");return}
 D.servicos[i]={nome:n,preco:+$("#sp"+i).value||0};salvar();
 const b=$("#sv"+i);b.classList.remove("pend");b.textContent="✔ Salvo";setTimeout(()=>{if(!b.classList.contains("pend"))b.textContent="💾 Salvar"},1800);
 toast("Serviço salvo ✔");
}
function novoSvc(){
 const n=$("#nv_n").value.trim();if(!n){toast("Escreva o nome do serviço novo");$("#nv_n").focus();return}
 D.servicos.push({nome:n,preco:+$("#nv_p").value||0});salvar();render();toast("Serviço cadastrado ✔");
}
function pedeExcluirSvc(i){
 $("#sx"+i).innerHTML=`<div class="acts"><span class="sub" style="flex-basis:100%">Apagar "${esc(D.servicos[i].nome)}" da tabela?</span><button class="danger" onclick="D.servicos.splice(${i},1);salvar();render();toast('Serviço apagado')">Sim, apagar</button><button onclick="render()">Cancelar</button></div>`;
}

 el.innerHTML=`<button class="foto" onclick="abrirFoto()" aria-label="Mudar a foto"><img src="${D.perfil.foto||FOTO_PADRAO}" alt="Foto de ${esc(nomeP())}"><span class="cam">📷</span></button>

function trocaFoto(inp){

 r.onload=()=>{const im=new Image();im.onload=()=>{

// ===== PIX =====
function tlv(id,v){return id+String(v.length).padStart(2,"0")+v}
function crc16(t){let c=0xFFFF;for(let i=0;i<t.length;i++){c^=t.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,"0")}
const semAc=t=>String(t||"").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9 ]/g,"").toUpperCase().trim();
function pixChave(){
 const x=D.pix||{},c=String(x.chave||"").trim();
 if(x.tipo==="Celular"){let n=c.replace(/\D/g,"");if(!(n.length>11&&n.startsWith("55")))n="55"+n;return "+"+n}
 if(x.tipo==="CPF")return c.replace(/\D/g,"");
 if(x.tipo==="E-mail")return c.toLowerCase();
 return c;
}
function pixPayload(v){
 const x=D.pix||{};
 const t=tlv("00","01")+tlv("26",tlv("00","br.gov.bcb.pix")+tlv("01",pixChave()))+tlv("52","0000")+tlv("53","986")+(v>0?tlv("54",v.toFixed(2)):"")+tlv("58","BR")+tlv("59",(semAc(x.nome)||"RECEBEDOR").slice(0,25))+tlv("60",(semAc(x.cidade)||"TATUI").slice(0,15))+tlv("62",tlv("05","***"))+"6304";
 return t+crc16(t);
}
const temPix=()=>!!(D.pix&&D.pix.chave);
function caixaPix(v){
 if(!temPix())return `<div class="pixbox"><p>Você ainda não colocou sua chave Pix.<br>Vá em <b>Mais</b> e preencha <b>🔑 Minha chave Pix</b>.</p></div>`;
 return `<div class="pixbox"><span class="lbl">🔑 Seu Pix</span>
  <div class="pixchave">${esc(D.pix.tipo)}: <b>${esc(D.pix.chave)}</b></div>
  <button type="button" onclick="copiaPix(0)">📋 Copiar chave Pix</button>
  <div class="qr" id="qr" aria-label="QR Code do Pix"></div>
  <p class="hint">O cliente abre o app do banco e aponta a câmera para o quadradinho.${v>0?` O valor de <b>${brl(v)}</b> já vem preenchido.`:" Ele digita o valor."}</p>
  <button type="button" onclick="copiaPix(${v||0},1)">📋 Copiar Pix copia e cola</button>
  ${botoesPix(v)}</div>`;
}
function desenhaQR(v){const el=$("#qr");if(!el)return;el.innerHTML="";if(window.QRCode){try{new QRCode(el,{text:pixPayload(v),width:190,height:190,correctLevel:QRCode.CorrectLevel.M})}catch(e){el.textContent="Não deu para criar o quadradinho. Use a chave."}}else el.textContent="Sem internet para criar o quadradinho. Use a chave."}
async function copiaPix(v,cc){toast(await copiar(cc?pixPayload(v):D.pix.chave)?"Copiado ✔":"Não deu para copiar. Anote a chave.")}

function textoPix(v){
 const x=D.pix;return `💰 Pix para pagamento${x.nome?" — "+x.nome:""}\n`+(v>0?`Valor: ${brl(v)}\n`:"")+`Chave (${x.tipo}): ${x.chave}\n\nPix copia e cola:\n${pixPayload(v)}`;
}
async function compartilhaPix(v){
 const t=textoPix(v);
 try{if(navigator.share){await navigator.share({title:"Pix",text:t});return}}catch(e){if(e&&e.name==="AbortError")return}
 toast(await copiar(t)?"Pix copiado. Agora é só colar na conversa.":"Use o botão verde do WhatsApp");
}
const botoesPix=v=>`<div class="acts" style="width:100%"><button type="button" class="primary" onclick="compartilhaPix(${v||0})">📤 Compartilhar Pix</button><a class="btn zap" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(textoPix(v||0))}">Mandar no WhatsApp</a></div>`;
function salvaPix(){
 const c=$("#px_c").value.trim();if(!c){toast("Escreva a sua chave Pix");return}
 D.pix={tipo:$("#px_t").value,chave:c,nome:$("#px_n").value.trim(),cidade:$("#px_cd").value.trim()||"Tatuí"};salvar();render();toast("Chave Pix salva ✔");
}

function salvaPag(){

const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

function mudaMes(d){let [a,m]=mesCx.split("-").map(Number);m+=d;if(m<1){m=12;a--}if(m>12){m=1;a++}mesCx=a+"-"+String(m).padStart(2,"0");render()}
function recebidosDoMes(mes){
 const r=[];
 D.pedidos.forEach(p=>(p.pagamentos||[]).forEach(x=>{if(x.data&&x.data.startsWith(mes))r.push({p,valor:+x.valor||0,data:x.data,tipo:x.forma||"Pagou"})}));
 return r.sort((a,b)=>b.data.localeCompare(a.data));

const CHIPS_GASTO=["Elástico","Linha","Zíper","Botão","Agulha","Tecido / forro","Transporte"];
function addDias(iso,n){const d=new Date(iso+"T12:00");d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function iniSemana(iso){return addDias(iso,-new Date(iso+"T12:00").getDay())}
const entre=(d,a,b)=>!!d&&d>=a&&d<=b;
const longo=iso=>new Date(iso+"T12:00").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
let diaCx=hojeISO(),semCx=null;
function mudaDia(n){diaCx=addDias(diaCx,n);render()}
function mudaSem(n){semCx=addDias(semCx||iniSemana(hojeISO()),7*n);render()}

function resumo(a,b){
 const rec=[];D.pedidos.forEach(p=>(p.pagamentos||[]).forEach(x=>{if(entre(x.data,a,b))rec.push({p,valor:+x.valor||0,data:x.data,tipo:x.forma||"Pagou"})}));
 const tR=rec.reduce((s,x)=>s+x.valor,0);
 const gas=(D.gastos||[]).filter(g=>entre(g.data,a,b));const tG=gas.reduce((s,g)=>s+(+g.valor||0),0);
 const atend=D.pedidos.filter(p=>p.status==="entregue"&&entre(p.entregueEm||p.entrega,a,b));
 const aRec=D.pedidos.filter(p=>falta(p)>0&&entre(p.vencePag||p.entrega,a,b)).reduce((s,p)=>s+falta(p),0);
 const res=tR*(D.reserva??25)/100;
 return {a,b,rec,tR,gas,tG,atend,aRec,res,fica:tR-res,sobra:tR-tG,usado:somaUso(usadoEntre(a,b))};
}

  if(!el){const so=["andar","receber","apagar"].includes(k),es=k==="estoque";toast(so?"Ainda não tem pedido. Faça antes a lição ➕ Anotar uma roupa nova.":es?"Ainda não tem material. Cadastre um no Estoque primeiro.":"Não achei nesta tela. Leia os passos de novo.");return}
  el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("alvo");
  const embaixo=el.getBoundingClientRect().top+scrollY<420;
  document.body.insertAdjacentHTML("beforeend",`<div class="guia${embaixo?" baixo":""}" id="guia"><div><b>👆 ${a.dica}</b></div><div class="acts"><button onclick="tiraGuia();marcaFeita('${k}')">✅ Aprendi</button><button onclick="tiraGuia();abrirLicao('${k}')">Ver os passos</button></div></div>`);
  el.addEventListener("click",()=>{el.classList.remove("alvo")},{once:true});
 },150);
}
function tiraGuia(){$("#guia")?.remove();document.querySelectorAll(".alvo").forEach(e=>e.classList.remove("alvo"))}

 ["💻 No computador","Também dá para usar no computador.<br>Copie o link do app no <b>WhatsApp</b>.<br>Cole no <b>Google Chrome</b> e aperte Enter.<br>O passo a passo completo está em <b>Mais</b>."],
 ["🧰 Estoque","Toque em <b>Estoque</b> no menu de baixo.<br>Usou um botão ou um zíper? Toque em <b>➖ Usei</b>.<br>O app tira do estoque e mostra quanto gastou na semana e no mês."],

];
let passo=0;
function abrirTour(){passo=0;desenhaTour()}
function desenhaTour(){
 const [t,x]=PASSOS[passo];const ult=passo===PASSOS.length-1;
 $("#modal").innerHTML=`<div class="sheet"><div class="box tour">
  <div class="bolas">${PASSOS.map((_,i)=>`<i class="${i===passo?"on":""}"></i>`).join("")}</div>
  <h2>${t}</h2><p>${x}</p>
  <div class="acts">${passo?'<button onclick="passo--;desenhaTour()">Voltar</button>':""}
  <button class="primary" onclick="${ult?"fimTour()":"passo++;desenhaTour()"}">${ult?"Começar a usar":"Próximo"}</button></div>
  ${ult?'<button class="zap grande" onclick="fimTour();abrirAula()">🎓 Fazer a aula agora</button>':""}
  ${ult?"":'<button class="pular" onclick="fimTour()">Pular explicação</button>'}
 </div></div>`;
}
function fimTour(){fechar()}
function semOla(){try{localStorage.setItem(KEY+"_tour","1")}catch(e){}}

function telaMais(){
 return dica("mais")+`<h2>Mais</h2>
 <div class="card"><div class="acts">
  <button class="primary" onclick="compartilhar()">Compartilhar aplicativo</button>

 <div class="card"><span class="lbl">🔑 Minha chave Pix</span>

  <button class="primary" onclick="salvaPix()">💾 Salvar Pix</button>
  ${temPix()?`<p class="hint">Mande a sua chave Pix para alguém:</p>${botoesPix(0)}`:""}</div>
 <div class="card pc"><span class="lbl">💻 Usar no computador</span>
  <p>👉 No computador, abra o <b>WhatsApp</b>.</p>
  <p>👉 Ache a mensagem com o <b>link do app</b>.</p>
  <p>👉 Clique no link com o <b>botão direito</b> do mouse e escolha <b>Copiar link</b>.</p>
  <p>👉 Abra o <b>Google Chrome</b>.</p>
  <p>👉 Clique na barra lá em cima, onde se escreve o site.</p>
  <p>👉 Clique com o <b>botão direito</b> e escolha <b>Colar</b>. Aperte <b>Enter</b>.</p>
  <p>⭐ Clique na <b>estrelinha</b> no canto da barra. Assim o app fica salvo e você não precisa copiar de novo.</p>
  <div class="aviso">⚠️ O que você anota no celular <b>não aparece sozinho</b> no computador. O melhor é usar sempre o mesmo.<br>Quer passar os pedidos? Aqui em <b>Mais</b>, toque em <b>Copiar dados</b>. Mande para você no WhatsApp. No outro aparelho, cole em <b>Cópia de segurança</b> e toque em <b>Restaurar</b>.</div>
 </div>
 <div class="card"><span class="lbl">Cores dos pedidos</span>
  <div class="legend">

   <div><span style="background:var(--warn)"></span>Em costura — sendo feita</div>
   <div><span style="background:var(--ok)"></span>Pronto — avisar o cliente</div>

  </div></div>

  <div class="sub">Apaga os pedidos, os gastos e o material usado. Os preços, o estoque e a chave Pix ficam.</div>
  <div id="zeroBox"><button class="danger" onclick="$('#zeroBox').innerHTML='<div class=&quot;acts&quot;><button class=&quot;danger&quot; onclick=&quot;zerar()&quot;>Sim, apagar tudo</button><button onclick=&quot;render()&quot;>Cancelar</button></div>'">Apagar todos os pedidos</button></div></div>`;
}

function render(manterFoco){
 const t={inicio:telaInicio,pedidos:telaPedidos,servicos:telaServicos,caixa:telaCaixa,estoque:telaEstoque,mais:telaMais}[aba]();
 $("#tela").innerHTML=t;
 desenhaPerfil();
 const pend=k=>D.pedidos.some(p=>(k==="todos"||p.origem===k)&&(atrasado(p)||(p.entrega===hojeISO()&&p.status!=="pronto"&&p.status!=="entregue")));
 $("#origens").innerHTML=[["todos","Todos"],...origens()].map(([k,n])=>`<button class="${origem===k?"on":""}" onclick="escolheOrigem('${k}')">${esc(n)}${k!=="todos"&&pend(k)?'<i class="dot" aria-label="Tem pedido pendente"></i>':""}</button>`).join("")+`<button class="edit" aria-label="Mudar nomes" onclick="editarOrigens()">✏️</button>`;
 document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===aba));
 const alerta=D.pedidos.some(p=>atrasado(p)||(p.entrega===hojeISO()&&p.status!=="pronto"&&p.status!=="entregue"));
 const pb=document.querySelector('#nav [data-t="pedidos"]');
 pb.querySelector(".dot")?.remove(); if(alerta)pb.insertAdjacentHTML("beforeend",'<i class="dot" aria-label="Há pedidos pendentes"></i>');
 const eb=document.querySelector('#nav [data-t="estoque"]');eb.querySelector(".dot")?.remove();if((D.estoque||[]).some(baixo))eb.insertAdjacentHTML("beforeend",'<i class="dot" aria-label="Material acabando"></i>');
 if(manterFoco){const b=$("#busca");if(b){b.focus();b.setSelectionRange(b.value.length,b.value.length)}}
}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{aba=b.dataset.t;try{localStorage.setItem(KEY+"_aba",aba)}catch(e){};render();scrollTo(0,0)});

function avancar(id){
 const p=D.pedidos.find(x=>x.id===id);const i=STATUS.findIndex(s=>s[0]===p.status);
 p.status=STATUS[Math.min(i+1,3)][0];if(p.status==="entregue")p.entregueEm=hojeISO();
 salvar();render();toast(stNome(p.status));
 if(p.status==="entregue"&&falta(p)>0)abrirPag(id,1);
}

let sel=[];
function abrirForm(id){
 const p=id?D.pedidos.find(x=>x.id===id):{origem:origem==="todos"?((origens()[0]||["loja"])[0]):origem,cliente:"",fone:"",peca:"Calça",servicos:[],medidas:"",entrada:hojeISO(),entrega:hojeISO(3),valor:0,sinal:0,status:"recebido",obs:""};
 sel=p.servicos.map(s=>({...s}));
 $("#modal").innerHTML=`<div class="sheet" onclick="if(event.target===this)fechar()"><form class="box" id="fp" onsubmit="event.preventDefault();gravar(${id||0})">
  <div class="row"><h2>${id?"Editar pedido":"Novo pedido"}</h2><button type="button" onclick="fechar()">Fechar</button></div>
  <p class="hint">Escreva o nome, toque no serviço e depois em <b>Salvar pedido</b> lá embaixo.</p>
  <div class="field"><label class="lbl" for="f_org">De onde veio</label><select id="f_org">${origens().map(([k,n])=>`<option value="${k}" ${k===p.origem?"selected":""}>${n}</option>`).join("")}</select></div>
  <div class="field"><label class="lbl" for="f_cli">Cliente</label><input id="f_cli" required value="${esc(p.cliente)}" placeholder="Nome do cliente"></div>
  <div class="field"><label class="lbl" for="f_fone">WhatsApp</label><input id="f_fone" inputmode="tel" value="${esc(p.fone)}" placeholder="15 99999-9999"></div>
  <div class="field"><label class="lbl" for="f_peca">Peça</label><select id="f_peca">${PECAS.map(x=>`<option ${x===p.peca?"selected":""}>${x}</option>`).join("")}</select></div>
  <div class="field"><span class="lbl">Serviços (toque para marcar)</span><p class="hint">Toque no que o cliente pediu. Fica amarelo. Tocou errado? Toque de novo.</p><div class="svc" id="svcs"></div></div>
  <div class="grid2"><input id="f_on" placeholder="Outro serviço"><input id="f_op" type="number" inputmode="decimal" placeholder="Preço"></div>
  <p class="hint">Não achou? Escreva aqui em cima e toque no botão.</p>
  <button type="button" onclick="addOutro()">Adicionar outro serviço</button>
  <div class="field"><label class="lbl" for="f_med">Medidas / o que fazer</label><textarea id="f_med" placeholder="Ex.: tirar 3 cm na barra, apertar 2 cm na cintura">${esc(p.medidas)}</textarea></div>
  <div class="grid2"><div class="field"><label class="lbl" for="f_ent">Deixou em</label><input id="f_ent" type="date" value="${p.entrada}"></div>
   <div class="field"><label class="lbl" for="f_pz">Entregar em</label><input id="f_pz" type="date" value="${p.entrega}"></div></div>
  <div class="total"><span class="lbl">Total</span><b id="tot"></b></div>
  <div class="grid2"><div class="field"><label class="lbl" for="f_val">Valor cobrado</label><input id="f_val" type="number" inputmode="decimal" value="${p.valor}"></div>
   <div class="field"><label class="lbl" for="f_sin">Já pagou (sinal)</label><input id="f_sin" type="number" inputmode="decimal" value="${p.sinal}" ${id?"readonly":""}></div></div>
  <p class="hint">Deixou dinheiro adiantado? Coloque em <b>Já pagou</b>.</p>
  <p class="hint">Cliente desistiu? Em <b>Situação</b>, escolha <b>Cancelado</b>.</p>
  <div class="field"><label class="lbl" for="f_st">Situação</label><select id="f_st">${STATUS.map(([k,n])=>`<option value="${k}" ${k===p.status?"selected":""}>${n}</option>`).join("")}</select></div>
  <div class="field"><label class="lbl" for="f_obs">Observações</label><textarea id="f_obs">${esc(p.obs)}</textarea></div>
  <button class="primary" type="submit">Salvar pedido</button>
  ${id?`<div id="delBox"><button type="button" class="danger" onclick="$('#delBox').innerHTML='<div class=&quot;acts&quot;><button type=&quot;button&quot; class=&quot;danger&quot; onclick=&quot;excluir(${id})&quot;>Sim, excluir</button><button type=&quot;button&quot; onclick=&quot;abrirForm(${id})&quot;>Cancelar</button></div>'">Excluir pedido</button></div>`:""}
 </form></div>`;
 desenhaSvcs(!id);
}
function desenhaSvcs(auto){
 const nomes=new Set(sel.map(s=>s.nome));
 const extras=sel.filter(s=>!D.servicos.some(d=>d.nome===s.nome));
 $("#svcs").innerHTML=[...D.servicos,...extras].map(s=>`<button type="button" class="${nomes.has(s.nome)?"on":""}" onclick="togSvc('${esc(s.nome).replace(/'/g,"\\'")}',${s.preco})">${esc(s.nome)} · ${brl(s.preco)}</button>`).join("");
 const soma=sel.reduce((a,s)=>a+(+s.preco||0),0);
 $("#tot").textContent=brl(soma);
 if(auto)$("#f_val").value=soma;
}
function togSvc(n,p){const i=sel.findIndex(s=>s.nome===n);if(i>=0)sel.splice(i,1);else sel.push({nome:n,preco:p});desenhaSvcs(true)}
function addOutro(){const n=$("#f_on").value.trim();if(!n)return;sel.push({nome:n,preco:+$("#f_op").value||0});$("#f_on").value="";$("#f_op").value="";desenhaSvcs(true)}
function gravar(id){
 const dados={origem:$("#f_org").value,cliente:$("#f_cli").value.trim(),fone:$("#f_fone").value.trim(),peca:$("#f_peca").value,servicos:sel,medidas:$("#f_med").value.trim(),
  entrada:$("#f_ent").value,entrega:$("#f_pz").value,valor:+$("#f_val").value||0,sinal:+$("#f_sin").value||0,status:$("#f_st").value,obs:$("#f_obs").value.trim()};
 if(!dados.servicos.length){toast("Marque pelo menos um serviço");return}
 if(id){const p=D.pedidos.find(x=>x.id===id);delete dados.sinal;Object.assign(p,dados);delete p.ex;if(p.status==="entregue"&&!p.entregueEm)p.entregueEm=hojeISO();if(p.status==="cancelado"&&!p.canceladoEm)p.canceladoEm=hojeISO()}
 else D.pedidos.push({id:Date.now(),...dados,pagamentos:dados.sinal>0?[{data:dados.entrada||hojeISO(),valor:dados.sinal,forma:"Sinal"}]:[]});
 salvar();fechar();render();toast("Pedido salvo");
}
function pedirExcluir(id){
 const p=D.pedidos.find(x=>x.id===id);
 $("#acts"+id).innerHTML=`<div class="sub" style="flex-basis:100%">Excluir o pedido de ${esc(p.cliente)}?</div><button class="danger" onclick="excluir(${id})">Sim, excluir</button><button onclick="render()">Cancelar</button>`;
}
function excluir(id){D.pedidos=D.pedidos.filter(p=>p.id!==id);salvar();fechar();render();toast("Pedido excluído")}
function fechar(){$("#modal").innerHTML=""}
$("#fab").onclick=()=>abrirForm(0);

async function copiar(t){try{await navigator.clipboard.writeText(t);return true}catch(e){return false}}
async function compartilhar(){
 const url=location.href.split("#")[0];
 try{if(navigator.share){await navigator.share({title:"Reforma Fácil",text:"App para controlar barras e ajustes de roupa",url});return}}catch(e){}
 toast(await copiar(url)?"Link copiado":"Copie o link pela barra do navegador");
}
function atualizar(){toast("Atualizando…");setTimeout(()=>location.reload(),500)}
async function copiarBackup(){
 const t=JSON.stringify(D);
 if(await copiar(t))toast("Dados copiados");else{$("#bk").value=t;$("#bk").select();toast("Selecione e copie o texto")}
}
function restaurar(){
 try{const x=JSON.parse($("#bk").value);if(!x.pedidos||!x.servicos)throw 0;D=x;salvar();render();toast("Dados restaurados")}
 catch(e){toast("Texto colado não é uma cópia válida")}
}
function zerar(){D.pedidos=[];D.gastos=[];D.usos=[];salvar();render();toast("Pedidos apagados")}

render();
function boasVindas(){
 $("#modal").innerHTML=`<div class="sheet"><div class="box tour">
  <h2>👋 Olá${nomeP()?", "+esc(nomeP()):""}! Bem-vinda!</h2>
  <p>Este app anota as roupas que você pega para arrumar.<br>Vamos aprender a usar? É rapidinho.</p>
  <button class="primary grande" onclick="abrirAula()">🎓 ${Object.keys(feitas).length?"Continuar a aula":"Começar a aula"}</button>
  <button onclick="abrirTour()">Ver só um resumo rápido</button>
  <button class="pular" onclick="semOla();fechar()">Pular, já sei usar</button>

 </div></div>`;
}
try{if(!localStorage.getItem(KEY+"_tour"))boasVindas()}catch(e){boasVindas()}
