<style>
  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-2: #f2f7f3;
    --line: #dbe8de;
    --text: #163422;
    --text-dim: #5c7864;
    --accent: #2f7a4f;
    --accent-dim: #cfe8d7;
    --accent-text: #ffffff;
    --red: #c85a40;
    --amber: #b8912e;
    --green: #2f7a4f;
    --gray: #8a978f;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    min-height:100vh;
    padding: 18px 14px 40px;
  }
  .wrap{max-width:480px;margin:0 auto;}

  header{
    margin-bottom:20px;
    padding-bottom:14px;
    border-bottom: 1px solid var(--line);
  }
  header h1{
    font-size: 22px;
    font-weight: 600;
    margin: 0 0 4px;
    letter-spacing: 0.2px;
    color: var(--accent);
  }
  header p{
    margin:0;
    color: var(--text-dim);
    font-size: 13px;
    font-family: -apple-system, system-ui, sans-serif;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    margin-bottom: 16px;
  }

  label{
    display:block;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 12.5px;
    color: var(--text-dim);
    margin: 14px 0 6px;
  }
  label:first-of-type{margin-top:0;}

  input[type="text"], input[type="date"], textarea, select{
    width:100%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 16px;
    padding: 11px 12px;
    -webkit-appearance:none;
    appearance:none;
  }
  input:focus, textarea:focus, select:focus{
    outline: none;
    border-color: var(--accent);
  }
  textarea{ resize:vertical; min-height:70px; }

  .situacao-opts{
    display:flex;
    gap:8px;
  }
  .situacao-opts button{
    flex: 1;
    padding: 12px 6px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text-dim);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    transition: all .15s ease;
  }
  .situacao-opts button.active[data-sit="Travado"]{
    background: rgba(217,105,79,0.18);
    border-color: var(--red);
    color: var(--red);
  }
  .situacao-opts button.active[data-sit="Desligado"]{
    background: rgba(217,182,79,0.18);
    border-color: var(--amber);
    color: var(--amber);
  }
  .situacao-opts button.active[data-sit="Avariado"]{
    background: rgba(47,122,79,0.18);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Leituras */
  .leitura-row{
    display:flex;
    gap:8px;
    margin-bottom: 8px;
  }
  .leitura-row input{
    flex:1;
  }
  .leitura-row .rm-leitura{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--gray);
    border-radius: 8px;
    width: 40px;
    font-size: 16px;
    cursor:pointer;
  }
  .add-leitura-btn{
    width:100%;
    padding: 9px;
    margin-bottom: 4px;
    border-radius: 8px;
    border: 1px dashed var(--accent-dim);
    background: var(--panel-2);
    color: var(--accent);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
  }

  /* Etapas */
  .etapa-opts{
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .etapa-opts button{
    padding: 7px 4px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--text-dim);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor:pointer;
    transition: all .15s ease;
  }
  .etapa-opts button.active{
    background: rgba(47,122,79,0.18);
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Fotos */
  .foto-input-row{
    display:flex;
    gap:8px;
  }
  .foto-btn{
    flex:1;
    padding: 11px 8px;
    border-radius: 8px;
    border: 1px dashed var(--accent-dim);
    background: var(--panel-2);
    color: var(--accent);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor:pointer;
    text-align:center;
  }
  .foto-preview{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top: 10px;
  }
  .foto-thumb{
    position:relative;
    width: 64px;
    height: 64px;
    border-radius: 8px;
    overflow:hidden;
    border: 1px solid var(--line);
  }
  .foto-thumb img{
    width:100%;
    height:100%;
    object-fit: cover;
    display:block;
  }
  .foto-thumb .rm{
    position:absolute;
    top:2px;
    right:2px;
    width:18px;
    height:18px;
    border-radius:50%;
    background: rgba(0,0,0,0.65);
    color:#fff;
    border:none;
    font-size:11px;
    line-height:18px;
    text-align:center;
    cursor:pointer;
    padding:0;
  }

  .save-btn{
    width:100%;
    margin-top:18px;
    padding: 14px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor:pointer;
  }
  .save-btn:active{ opacity:0.85; }
  .save-btn:disabled{ background: var(--gray); color:#333; }

  .status-msg{
    text-align:center;
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 10px;
    min-height: 16px;
  }

  .section-title{
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    color: var(--text-dim);
    text-transform: none;
    margin: 26px 2px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .section-title span.count{
    color: var(--accent);
    font-weight:600;
  }

  .entry{
    background: var(--panel);
    border: 1px solid var(--line);
    border-left: 3px solid var(--gray);
    border-radius: 8px;
    padding: 12px 14px;
    margin-bottom: 10px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .entry.Travado{ border-left-color: var(--red); }
  .entry.Desligado{ border-left-color: var(--amber); }
  .entry.Avariado{ border-left-color: var(--accent); }

  .entry-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    gap:10px;
  }
  .entry-code{
    font-size: 15px;
    font-weight: 700;
    color: var(--accent);
  }
  .entry-date{
    font-size: 12px;
    color: var(--text-dim);
    white-space:nowrap;
  }
  .entry-meta{
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .entry-sit{
    font-weight:600;
  }
  .entry.Travado .entry-sit{ color: var(--red); }
  .entry.Desligado .entry-sit{ color: var(--amber); }
  .entry.Avariado .entry-sit{ color: var(--accent); }

  .entry.resolvido{
    opacity: 0.55;
    border-left-color: var(--green) !important;
  }
  .entry.resolvido .entry-code{
    text-decoration: line-through;
    text-decoration-color: var(--green);
  }

  .entry-obs{
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--text-dim);
    font-style: italic;
    border-top: 1px solid var(--line);
    padding-top: 6px;
  }

  .entry-fotos{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top: 8px;
  }
  .entry-fotos img{
    width: 52px;
    height: 52px;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--line);
    cursor:pointer;
  }

  .entry-actions{
    display:flex;
    justify-content: space-between;
    align-items:center;
    margin-top: 8px;
    padding-top: 6px;
    border-top: 1px solid var(--line);
  }
  .entry-del{
    background:none;
    border:none;
    color: var(--gray);
    font-size: 12px;
    font-family: -apple-system, system-ui, sans-serif;
    cursor:pointer;
    padding: 4px 0;
  }
  .entry-resolve{
    background:none;
    border: 1px solid var(--green);
    color: var(--green);
    border-radius: 6px;
    font-size: 12px;
    font-weight: 600;
    font-family: -apple-system, system-ui, sans-serif;
    cursor:pointer;
    padding: 5px 10px;
  }
  .entry-resolve.is-resolved{
    border-color: var(--gray);
    color: var(--gray);
  }

  .empty{
    text-align:center;
    color: var(--text-dim);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13px;
    padding: 30px 10px;
  }

  .export-btn{
    width:100%;
    padding: 11px;
    margin-bottom: 14px;
    border-radius: 8px;
    border: 1px solid var(--accent-dim);
    background: transparent;
    color: var(--accent);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .export-btn:active{ opacity: 0.75; }
  .export-btn:disabled{
    color: var(--gray);
    border-color: var(--line);
    cursor: default;
  }

  /* Modal de foto */
  .foto-modal{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(0,0,0,0.88);
    z-index: 999;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding: 20px;
  }
  .foto-modal.open{ display:flex; }
  .foto-modal img{
    max-width: 100%;
    max-height: 70vh;
    border-radius: 8px;
  }
  .foto-modal-nav{
    display:flex;
    gap:14px;
    margin-top: 16px;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .foto-modal-nav button{
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 8px 16px;
    font-size: 13px;
    cursor:pointer;
  }
  .foto-modal-close{
    position:absolute;
    top: 18px;
    right: 18px;
    background:none;
    border:none;
    color:#fff;
    font-size: 26px;
    cursor:pointer;
    line-height:1;
  }

  footer.assinatura{
    text-align:center;
    margin-top: 26px;
    color: var(--accent);
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 12px;
    letter-spacing: 0.3px;
    opacity: 0.85;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Situação do Medidor</h1>
    <p>Registro de clientes — Travado, Desligado ou Avariado</p>
  </header>

  <div class="card">
    <label for="codigo">Código do cliente *</label>
    <input type="text" id="codigo" inputmode="numeric" placeholder="Ex: 00123456" autocomplete="off">

    <label for="medidor">Número do medidor *</label>
    <input type="text" id="medidor" inputmode="text" placeholder="Ex: 987654" autocomplete="off">

    <label>Leitura *</label>
    <div id="leituraList"></div>
    <button type="button" class="add-leitura-btn" id="addLeituraBtn">+ Adicionar leitura</button>

    <label>Situação *</label>
    <div class="situacao-opts" id="situacaoOpts">
      <button type="button" data-sit="Travado">Travado</button>
      <button type="button" data-sit="Desligado">Desligado</button>
      <button type="button" data-sit="Avariado">Avariado</button>
    </div>

    <label for="data">Data</label>
    <input type="date" id="data">

    <label for="obs">Observações</label>
    <textarea id="obs" placeholder="Detalhes adicionais (opcional)"></textarea>

    <label>Etapa</label>
    <div class="etapa-opts" id="etapaOpts"></div>

    <div class="foto-input-row" style="margin-top:16px;">
      <button type="button" class="foto-btn" id="fotoBtn">📷 Adicionar foto(s)</button>
      <input type="file" id="fotoInput" accept="image/*" multiple capture="environment" style="display:none;">
    </div>
    <div class="foto-preview" id="fotoPreview"></div>

    <button class="save-btn" id="saveBtn">Salvar registro</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div class="section-title">
    <span>Registros salvos<span id="tituloEtapaFiltro"></span></span>
    <span class="count" id="entryCount">0</span>
  </div>
  <button class="export-btn" id="exportBtn">Exportar registros (CSV)</button>
  <div id="entriesList"></div>

  <footer class="assinatura">Criado por Luis Ricardo</footer>
</div>

<div class="foto-modal" id="fotoModal">
  <button class="foto-modal-close" id="fotoModalClose">×</button>
  <img id="fotoModalImg" src="" alt="Foto">
  <div class="foto-modal-nav" id="fotoModalNav" style="display:none;">
    <button id="fotoModalPrev">‹ Anterior</button>
    <button id="fotoModalNext">Próxima ›</button>
  </div>
</div>

<script>
let entries = [];
let selectedSituacao = null;
let selectedEtapa = null;
let selectedFotos = []; // base64 das fotos ainda não salvas
let leituraValores = [''];
let modalFotos = [];
let modalIndex = 0;

function todayStr(){
  const d = new Date();
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

function formatDateDisplay(iso){
  if(!iso) return '';
  const [y,m,d] = iso.split('-');
  return `${d}/${m}/${y}`;
}

function formatDateHora(timestamp){
  if(!timestamp) return '';
  const d = new Date(timestamp);
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  const hh = String(d.getHours()).padStart(2,'0');
  const min = String(d.getMinutes()).padStart(2,'0');
  return `${dd}/${mm}/${yyyy} ${hh}:${min}`;
}

document.getElementById('data').value = todayStr();

// ---- Leituras: múltiplas leituras por registro ----
function renderLeituraRows(){
  const box = document.getElementById('leituraList');
  box.innerHTML = leituraValores.map((val, i) => `
    <div class="leitura-row">
      <input type="text" inputmode="decimal" placeholder="Ex: 1234.5" class="leitura-input" data-i="${i}" value="${val}">
      ${leituraValores.length > 1 ? `<button type="button" class="rm-leitura" data-i="${i}">×</button>` : ''}
    </div>
  `).join('');

  box.querySelectorAll('.leitura-input').forEach(inp=>{
    inp.addEventListener('input', ()=>{
      leituraValores[Number(inp.dataset.i)] = inp.value;
    });
  });

  box.querySelectorAll('.rm-leitura').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      leituraValores.splice(Number(btn.dataset.i), 1);
      renderLeituraRows();
    });
  });
}

document.getElementById('addLeituraBtn').addEventListener('click', ()=>{
  leituraValores.push('');
  renderLeituraRows();
});

renderLeituraRows();

document.querySelectorAll('#situacaoOpts button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#situacaoOpts button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    selectedSituacao = btn.dataset.sit;
  });
});

// Gera os botões de Etapa 1 a Etapa 18 (3 colunas)
const etapaOptsBox = document.getElementById('etapaOpts');
etapaOptsBox.innerHTML = Array.from({length:18}, (_,i)=> i+1).map(n =>
  `<button type="button" data-etapa="${n}">${n}</button>`
).join('');

etapaOptsBox.querySelectorAll('button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const jaAtiva = btn.classList.contains('active');
    etapaOptsBox.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
    if(!jaAtiva){
      btn.classList.add('active');
      selectedEtapa = Number(btn.dataset.etapa);
    }else{
      selectedEtapa = null;
    }
    renderEntries();
  });
});

// Abre o seletor de arquivos ao tocar no botão de foto
document.getElementById('fotoBtn').addEventListener('click', ()=>{
  document.getElementById('fotoInput').click();
});

// ---- Fotos: compressão e preview ----
function compressImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const maxW = 900;
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', 0.6));
      };
      img.onerror = () => reject(new Error('Falha ao carregar imagem'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Falha ao ler arquivo'));
    reader.readAsDataURL(file);
  });
}

function renderFotoPreview(){
  const box = document.getElementById('fotoPreview');
  box.innerHTML = selectedFotos.map((foto, i) => `
    <div class="foto-thumb">
      <img src="${foto}" data-i="${i}">
      <button class="rm" data-i="${i}" type="button">×</button>
    </div>
  `).join('');

  box.querySelectorAll('.rm').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedFotos.splice(Number(btn.dataset.i), 1);
      renderFotoPreview();
    });
  });
}

document.getElementById('fotoInput').addEventListener('change', async (e)=>{
  const files = Array.from(e.target.files || []);
  for(const file of files){
    try{
      const dataUrl = await compressImage(file);
      selectedFotos.push(dataUrl);
    }catch(err){
      console.error('Erro ao processar foto', err);
    }
  }
  renderFotoPreview();
  e.target.value = '';
});

function limparFormulario(){
  document.getElementById('codigo').value = '';
  document.getElementById('medidor').value = '';
  document.getElementById('obs').value = '';
  selectedSituacao = null;
  selectedEtapa = null;
  selectedFotos = [];
  renderFotoPreview();
  leituraValores = [''];
  renderLeituraRows();
  document.querySelectorAll('#situacaoOpts button').forEach(b=>{
    b.classList.remove('active');
  });
  document.querySelectorAll('#etapaOpts button').forEach(b=>{
    b.classList.remove('active');
  });
  document.getElementById('data').value = todayStr();
  document.getElementById('codigo').focus();
}

const CHAVE_DADOS = 'situacao-medidor-entries';
let usarArmazenamentoLocal = false;

async function loadEntries(){
  if(!usarArmazenamentoLocal){
    try{
      const result = await window.storage.get(CHAVE_DADOS, false);
      entries = result && result.value ? JSON.parse(result.value) : [];
      renderEntries();
      return;
    }catch(e){
      usarArmazenamentoLocal = true;
    }
  }
  try{
    const raw = localStorage.getItem(CHAVE_DADOS);
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
  renderEntries();
}

async function saveEntries(){
  if(!usarArmazenamentoLocal){
    try{
      await window.storage.set(CHAVE_DADOS, JSON.stringify(entries), false);
      return;
    }catch(e){
      usarArmazenamentoLocal = true;
    }
  }
  try{
    localStorage.setItem(CHAVE_DADOS, JSON.stringify(entries));
  }catch(e){
    console.error('Erro ao salvar', e);
  }
}

function renderEntries(){
  const list = document.getElementById('entriesList');
  const filtradas = selectedEtapa ? entries.filter(e => e.etapa === selectedEtapa) : entries;

  document.getElementById('entryCount').textContent = filtradas.length;
  const tituloEtapa = document.getElementById('tituloEtapaFiltro');
  if(tituloEtapa){
    tituloEtapa.textContent = selectedEtapa ? ` · Etapa ${selectedEtapa}` : '';
  }
  atualizarBotaoExportar();

  if(filtradas.length === 0){
    list.innerHTML = `<div class="empty">${selectedEtapa ? `Nenhum registro na Etapa ${selectedEtapa} ainda.` : 'Nenhum registro ainda. Preencha o formulário acima.'}</div>`;
    return;
  }

  const sorted = [...filtradas].sort((a,b)=> b.criadoEm - a.criadoEm);

  list.innerHTML = sorted.map(e => `
    <div class="entry ${e.situacao}${e.resolvido ? ' resolvido' : ''}">
      <div class="entry-top">
        <span class="entry-code">${e.codigo}</span>
        <span class="entry-date">${formatDateDisplay(e.data)}</span>
      </div>
      <div class="entry-meta">Medidor <strong>${e.medidor || '—'}</strong> · <span class="entry-sit">${e.situacao === 'Avariado' ? 'Medidor avariado' : e.situacao}</span>${e.etapa ? ` · Etapa ${e.etapa}` : ''}</div>
      ${e.leituras && e.leituras.length ? `<div class="entry-meta">Leitura${e.leituras.length > 1 ? 's' : ''}: ${e.leituras.join(', ')}</div>` : ''}
      <div class="entry-meta">Lançado em ${formatDateHora(e.criadoEm)}</div>
      ${e.resolvido && e.resolvidoEm ? `<div class="entry-meta">Resolvido em ${formatDateHora(e.resolvidoEm)}</div>` : ''}
      ${e.obs ? `<div class="entry-obs">${e.obs}</div>` : ''}
      ${e.fotos && e.fotos.length ? `<div class="entry-fotos" data-entry-id="${e.id}">${e.fotos.map((f,i)=>`<img src="${f}" data-i="${i}">`).join('')}</div>` : ''}
      <div class="entry-actions">
        <button class="entry-del" data-id="${e.id}">Excluir</button>
        <button class="entry-resolve${e.resolvido ? ' is-resolved' : ''}" data-id="${e.id}">${e.resolvido ? 'Reabrir' : 'Marcar como resolvido'}</button>
      </div>
    </div>
  `).join('');

  list.querySelectorAll('.entry-del').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      entries = entries.filter(e => e.id !== btn.dataset.id);
      await saveEntries();
      renderEntries();
    });
  });

  list.querySelectorAll('.entry-resolve').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const entry = entries.find(e => e.id === btn.dataset.id);
      if(entry){
        entry.resolvido = !entry.resolvido;
        entry.resolvidoEm = entry.resolvido ? Date.now() : null;
        await saveEntries();
        renderEntries();
      }
    });
  });

  list.querySelectorAll('.entry-fotos').forEach(container=>{
    const entryId = container.dataset.entryId;
    const entry = entries.find(e => e.id === entryId);
    container.querySelectorAll('img').forEach(img=>{
      img.addEventListener('click', ()=>{
        abrirModalFoto(entry.fotos, Number(img.dataset.i));
      });
    });
  });
}

// ---- Modal de visualização ----
function abrirModalFoto(fotos, index){
  modalFotos = fotos;
  modalIndex = index;
  atualizarModal();
  document.getElementById('fotoModal').classList.add('open');
}

function atualizarModal(){
  document.getElementById('fotoModalImg').src = modalFotos[modalIndex];
  document.getElementById('fotoModalNav').style.display = modalFotos.length > 1 ? 'flex' : 'none';
}

document.getElementById('fotoModalClose').addEventListener('click', ()=>{
  document.getElementById('fotoModal').classList.remove('open');
});
document.getElementById('fotoModal').addEventListener('click', (e)=>{
  if(e.target.id === 'fotoModal') document.getElementById('fotoModal').classList.remove('open');
});
document.getElementById('fotoModalPrev').addEventListener('click', ()=>{
  modalIndex = (modalIndex - 1 + modalFotos.length) % modalFotos.length;
  atualizarModal();
});
document.getElementById('fotoModalNext').addEventListener('click', ()=>{
  modalIndex = (modalIndex + 1) % modalFotos.length;
  atualizarModal();
});

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const codigo = document.getElementById('codigo').value.trim();
  const medidor = document.getElementById('medidor').value.trim();
  const data = document.getElementById('data').value;
  const obs = document.getElementById('obs').value.trim();
  const statusMsg = document.getElementById('statusMsg');

  if(!codigo){
    statusMsg.textContent = 'Informe o código do cliente.';
    statusMsg.style.color = 'var(--red)';
    return;
  }
  if(!medidor){
    statusMsg.textContent = 'Informe o número do medidor.';
    statusMsg.style.color = 'var(--red)';
    return;
  }
  const leiturasPreenchidas = leituraValores.map(v => v.trim()).filter(v => v !== '');
  if(leiturasPreenchidas.length === 0){
    statusMsg.textContent = 'Informe ao menos uma leitura.';
    statusMsg.style.color = 'var(--red)';
    return;
  }
  if(!selectedSituacao){
    statusMsg.textContent = 'Selecione a situação do medidor.';
    statusMsg.style.color = 'var(--red)';
    return;
  }

  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  statusMsg.textContent = 'Salvando...';
  statusMsg.style.color = 'var(--text-dim)';

  const novoRegistro = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    codigo,
    medidor,
    leituras: leiturasPreenchidas,
    situacao: selectedSituacao,
    etapa: selectedEtapa,
    data,
    obs,
    fotos: [...selectedFotos],
    resolvido: false,
    criadoEm: Date.now()
  };

  entries.push(novoRegistro);
  await saveEntries();
  renderEntries();

  // Limpa o formulário após salvar, deixando pronto para o próximo lançamento.
  limparFormulario();

  btn.disabled = false;
  statusMsg.textContent = 'Registro salvo com sucesso.';
  statusMsg.style.color = 'var(--accent)';
  setTimeout(()=>{ statusMsg.textContent=''; }, 2500);
});

function escapeCsv(valor){
  const str = String(valor ?? '');
  if(str.includes(';') || str.includes('"') || str.includes('\n')){
    return '"' + str.replace(/"/g,'""') + '"';
  }
  return str;
}

function exportarCSV(){
  if(entries.length === 0) return;

  const cabecalho = ['Código do cliente','Número do medidor','Leituras','Situação','Etapa','Data','Lançado em','Observações','Qtd. fotos','Status','Resolvido em'];
  const linhas = [...entries]
    .sort((a,b)=> b.criadoEm - a.criadoEm)
    .map(e => [
      e.codigo,
      e.medidor,
      (e.leituras || []).join(' | '),
      e.situacao === 'Avariado' ? 'Medidor avariado' : e.situacao,
      e.etapa || '',
      formatDateDisplay(e.data),
      formatDateHora(e.criadoEm),
      e.obs || '',
      (e.fotos ? e.fotos.length : 0),
      e.resolvido ? 'Resolvido' : 'Em aberto',
      e.resolvido ? formatDateHora(e.resolvidoEm) : ''
    ].map(escapeCsv).join(';'));

  const csv = '\uFEFF' + [cabecalho.join(';'), ...linhas].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = `situacao-medidor-${todayStr()}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function atualizarBotaoExportar(){
  const btn = document.getElementById('exportBtn');
  btn.disabled = entries.length === 0;
}

document.getElementById('exportBtn').addEventListener('click', exportarCSV);

loadEntries();
</script>
</body>
</html>
