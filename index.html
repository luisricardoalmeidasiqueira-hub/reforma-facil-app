<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f7a4f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>LeituraFácil — Situação do Medidor</title>
<style>
:root{
  --bg:#f7fbf8;--panel:#fff;--panel2:#f1f7f3;--line:#d7e8dc;
  --text:#163422;--muted:#5c7864;--green:#2f7a4f;--green2:#24814f;
  --red:#c85a40;--amber:#b8912e;--gray:#8a978f;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{max-width:520px;margin:auto;min-height:100vh}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{padding:16px 14px 28px}
.app-cover{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#0d5334 0%,#197448 48%,#39a965 100%);
  border:0;border-radius:22px;padding:15px 16px 17px;margin-bottom:14px;
  color:#fff;box-shadow:0 10px 26px rgba(24,91,52,.18);
}
.cover-glow{position:absolute;width:170px;height:170px;border-radius:50%;right:-55px;top:-70px;background:rgba(255,255,255,.12)}
.cover-top{position:relative;display:flex;align-items:center;justify-content:space-between}
.app-cover .brand{color:#fff;font-size:21px}
.app-cover .brand span{color:#79e28d}
.app-cover .logo{width:36px;height:36px;border-radius:12px;background:rgba(255,255,255,.16);box-shadow:none}
.cover-badge{width:34px;height:34px;border-radius:12px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:18px}
.cover-title{position:relative;margin-top:12px;font-size:20px;font-weight:900;letter-spacing:-.3px}
.cover-subtitle{position:relative;margin-top:3px;font-size:12px;opacity:.88}

header{background:linear-gradient(135deg,#eaf6ee,#fff);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px rgba(35,91,56,.06)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:23px;color:#143d29}
.logo{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#157544,#55bd76);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 5px 12px rgba(47,122,79,.25)}
.brand span{color:#2f9b5d}
.subtitle{margin:7px 0 0;color:var(--muted);font-size:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 7px 22px rgba(28,78,47,.05)}
h2{font-size:18px;margin:0 0 12px;color:var(--muted)}
label{display:block;font-weight:800;font-size:14px;margin:13px 0 7px}
.req{color:var(--red)}
input,textarea,select{width:100%;border:1.5px solid var(--line);background:#fbfefc;color:var(--text);border-radius:13px;padding:12px 13px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(47,122,79,.10)}
textarea{min-height:82px;resize:vertical}
.stage-row{display:flex;gap:8px;align-items:center}
.stage-row button{width:44px;height:46px;border:1px solid var(--line);background:var(--panel2);color:var(--green);border-radius:13px;font-size:22px;font-weight:900}
.stage-row select{height:46px;font-weight:850;flex:1}
.reading-row{display:flex;gap:8px;margin-bottom:8px}
.reading-row input{flex:1}
.icon-btn{width:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);color:var(--green);font-weight:900}
.situation{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.situation button{border:1.5px solid var(--line);background:var(--panel2);color:var(--muted);padding:12px 6px;border-radius:13px;font-weight:850}
.situation button.active{background:#e9f6ed;border-color:var(--green);color:var(--green)}
.photo-btn{width:100%;border:1.5px dashed #b9dcc4;background:#f5fbf7;color:var(--green);padding:13px;border-radius:16px;font-weight:850;font-size:15px}
#photoInput{display:none}
.previews{display:flex;gap:8px;overflow:auto;margin-top:9px}
.previews img{width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.primary{width:100%;border:0;background:var(--green);color:#fff;padding:14px;border-radius:17px;font-weight:900;font-size:16px;margin-top:14px}
.primary:active{transform:scale(.99)}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.secondary{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--green);padding:11px 8px;border-radius:14px;font-weight:850;font-size:14px}
.save-icon{font-size:25px;line-height:1}.photo-icon{font-size:25px;line-height:1}.export-icon{font-size:24px;line-height:1}
.status{min-height:22px;margin-top:10px;text-align:center;color:var(--green);font-weight:750}
.records-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.count{min-width:30px;height:30px;border-radius:15px;background:#e3f2e8;color:var(--green);display:grid;place-items:center;font-weight:900}
.record{background:#fff;border:1px solid var(--line);border-left:6px solid var(--red);border-radius:18px;padding:13px;margin-bottom:10px}
.record.resolved{border-left-color:var(--green)}
.record-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.code{font-size:19px;font-weight:950;color:var(--green)}
.date{font-size:13px;color:var(--muted);font-weight:750}
.meta{margin-top:5px;color:var(--muted);font-size:14px;line-height:1.45}
.meta strong{color:var(--text)}
.bad{font-weight:900;color:var(--red)}
.good{font-weight:900;color:var(--green)}
.record-actions{display:flex;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
.record-actions button{flex:1;padding:10px;border-radius:11px;font-weight:800;border:1px solid var(--line);background:#fff}
.delete{color:var(--red)}
.resolve{color:var(--green)}
.empty{text-align:center;color:var(--muted);padding:24px 8px}
.footer{text-align:center;color:#4c9568;font-weight:750;padding:20px 0 5px}
.copyright{margin-top:7px;color:#7a8f81;font-size:11px;font-weight:600;letter-spacing:.1px}
@media(min-width:700px){body{padding-top:18px}}
</style>

<meta name="apple-mobile-web-app-title" content="LeituraFácil">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<main class="app">
<header class="app-cover">
  <div class="cover-glow"></div>
  <div class="cover-top">
    <div class="brand">
      <div class="logo">ϟ</div>
      <div>Leitura<span>Fácil</span></div>
    </div>
    <div class="cover-badge">⚡</div>
  </div>
  <div class="cover-title">Leitura de Energia</div>
  <div class="cover-subtitle">Controle simples, rápido e organizado.</div>
</header>

<section class="card">
  <label for="codigo">Código do cliente <span class="req">*</span></label>
  <input id="codigo" inputmode="numeric" autocomplete="off" placeholder="Digite o código">

  <label for="medidor">Número do medidor <span class="req">*</span></label>
  <input id="medidor" autocomplete="off" placeholder="Digite o número do medidor">

  <label>Leitura <span class="req">*</span></label>
  <div id="readingList"></div>
  <button class="secondary" id="addReading" type="button">＋ Adicionar leitura</button>

  <label for="situacao">Situação <span class="req">*</span></label>
  <select id="situacao">
    <option value="">Selecione a situação</option>
    <option value="Travado">Travado</option>
    <option value="Desligado">Desligado</option>
    <option value="Avariado">Avariado</option>
    <option value="Medidor caído">Medidor caído</option>
    <option value="Necessita tábua de fixação">Necessita tábua de fixação</option>
  </select>

  <label for="data">Data</label>
  <input id="data" type="date">

  <label for="obs">Observações</label>
  <textarea id="obs" placeholder="Digite uma observação, se necessário"></textarea>

  <label for="etapa">Etapa</label>
  <div class="stage-row">
    <button type="button" id="prevStage" aria-label="Etapa anterior">‹</button>
    <select id="etapa"></select>
    <button type="button" id="nextStage" aria-label="Próxima etapa">›</button>
  </div>

  <label>Fotos</label>
  <input id="photoInput" type="file" accept="image/*" capture="environment" multiple>
  <button class="photo-btn photo-icon" id="photoBtn" type="button" aria-label="Adicionar foto(s)" title="Adicionar foto(s)">📷</button>
  <div class="previews" id="previews"></div>

  <button class="primary save-icon" id="saveBtn" type="button" aria-label="Salvar registro" title="Salvar registro">💾</button>
  <div class="status" id="status"></div>
</section>

<section class="card">
  <div class="records-head">
    <h2>Registros da <span id="stageTitle">Etapa 1</span></h2>
    <div class="count" id="count">0</div>
  </div>

  <div class="toolbar">
    <button class="secondary export-icon" id="exportBtn" type="button" aria-label="Exportar todas as etapas" title="Exportar todas as etapas">📄</button>
  </div>

  <div id="records"></div>
</section>

<div class="footer">
  <div class="copyright">© 2026 Luis Ricardo — Todos os direitos reservados.</div>
</div>
</main>

<script>
const KEY='situacao-medidor-entries-v2';
let entries=[];
let selectedSituacao='';
let selectedFotos=[];
let readings=[''];
let stage=1;

const $=id=>document.getElementById(id);
const stages=Array.from({length:18},(_,i)=>i+1);

function todayStr(){
  const d=new Date();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${d.getFullYear()}-${m}-${day}`;
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtDate(v){
  if(!v)return '';
  const p=v.split('-');
  return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:v;
}
function fmtDateTime(ts){
  if(!ts)return '';
  const d=new Date(ts);
  return d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function saveData(){
  try{localStorage.setItem(KEY,JSON.stringify(entries));}catch(e){}
}
function loadData(){
  try{
    const raw=localStorage.getItem(KEY);
    entries=raw?JSON.parse(raw):[];
    if(!Array.isArray(entries))entries=[];
  }catch(e){entries=[]}
}
function renderStages(){
  $('etapa').innerHTML=stages.map(n=>`<option value="${n}">Etapa ${n}</option>`).join('');
  $('etapa').value=stage;
}
function renderReadings(){
  $('readingList').innerHTML='';
  readings.forEach((value,i)=>{
    const row=document.createElement('div');
    row.className='reading-row';
    row.innerHTML=`<input inputmode="numeric" class="reading" placeholder="Leitura ${i+1}" value="${esc(value)}">
      ${readings.length>1?'<button class="icon-btn remove-reading" type="button" aria-label="Remover leitura">−</button>':''}`;
    row.querySelector('.reading').addEventListener('input',e=>readings[i]=e.target.value);
    const rm=row.querySelector('.remove-reading');
    if(rm)rm.onclick=()=>{readings.splice(i,1);renderReadings()};
    $('readingList').appendChild(row);
  });
}
function setSituation(v){
  selectedSituacao=v;
  $('situacao').value=v||'';
}
function renderPhotos(){
  $('previews').innerHTML=selectedFotos.map(src=>`<img src="${src}" alt="Foto adicionada">`).join('');
}
function compress(file){
  return new Promise(resolve=>{
    const r=new FileReader();
    r.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=900, scale=Math.min(1,max/img.width);
        const c=document.createElement('canvas');
        c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg',.6));
      };
      img.src=r.result;
    };
    r.readAsDataURL(file);
  });
}
async function addPhotos(files){
  const list=Array.from(files||[]);
  for(const f of list){
    if(f.type.startsWith('image/')) selectedFotos.push(await compress(f));
  }
  renderPhotos();
}
function resetForm(){
  $('codigo').value='';
  $('medidor').value='';
  readings=[''];renderReadings();
  setSituation('');
  $('data').value=todayStr();
  $('obs').value='';
  selectedFotos=[];renderPhotos();
}
function renderRecords(){
  const filtered=entries.filter(e=>Number(e.etapa)===Number(stage)).sort((a,b)=>(b.criadoEm||0)-(a.criadoEm||0));
  $('stageTitle').textContent=`Etapa ${stage}`;
  $('count').textContent=filtered.length;
  if(!filtered.length){
    $('records').innerHTML='<div class="empty">Nenhum registro nesta etapa.</div>';
    return;
  }
  $('records').innerHTML=filtered.map(e=>{
    const sitClass=e.resolvido?'good':'bad';
    return `<article class="record ${e.resolvido?'resolved':''}">
      <div class="record-top"><div class="code">${esc(e.codigo)}</div><div class="date">${esc(fmtDate(e.data))}</div></div>
      <div class="meta">Medidor <strong>${esc(e.medidor)}</strong> · <span class="${sitClass}">${esc(e.situacao)}</span> · Etapa ${esc(e.etapa)}</div>
      <div class="meta">Leitura: <strong>${esc((e.leituras||[]).join(' / '))}</strong></div>
      <div class="meta">Lançado em ${esc(fmtDateTime(e.criadoEm))}</div>
      ${e.obs?`<div class="meta">Obs.: ${esc(e.obs)}</div>`:''}
      ${e.fotos?.length?`<div class="previews">${e.fotos.map(x=>`<img src="${x}" alt="Foto do registro">`).join('')}</div>`:''}
      <div class="record-actions">
        <button class="delete" type="button" onclick="deleteEntry('${esc(e.id)}')">Excluir</button>
        <button class="resolve" type="button" onclick="toggleResolved('${esc(e.id)}')">${e.resolvido?'Reabrir':'Marcar como resolvido'}</button>
      </div>
    </article>`;
  }).join('');
}
window.deleteEntry=id=>{
  if(!confirm('Excluir este registro?'))return;
  entries=entries.filter(e=>e.id!==id);saveData();renderRecords();
};
window.toggleResolved=id=>{
  const e=entries.find(x=>x.id===id);if(!e)return;
  e.resolvido=!e.resolvido;e.resolvidoEm=e.resolvido?Date.now():null;
  saveData();renderRecords();
};
function csvCell(v){
  return '"'+String(v??'').replace(/"/g,'""')+'"';
}
function exportCSV(){
  if(!entries.length){alert('Não há registros para exportar.');return;}
  const rows=[
    ['Código do cliente','Número do medidor','Leituras','Situação','Etapa','Data','Lançado em','Observações','Qtd. fotos','Status','Resolvido em'],
    ...entries.slice().sort((a,b)=>(Number(a.etapa)-Number(b.etapa))||(b.criadoEm-a.criadoEm)).map(e=>[
      e.codigo,e.medidor,(e.leituras||[]).join(' / '),e.situacao,e.etapa,fmtDate(e.data),
      fmtDateTime(e.criadoEm),e.obs||'',(e.fotos||[]).length,e.resolvido?'Resolvido':'Pendente',
      e.resolvidoEm?fmtDateTime(e.resolvidoEm):''
    ])
  ];
  const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`registros-todas-etapas-${todayStr()}.csv`;
  a.click();URL.revokeObjectURL(a.href);
}
$('etapa').addEventListener('change',e=>{stage=Number(e.target.value);renderRecords()});
$('prevStage').onclick=()=>{stage=stage<=1?18:stage-1;$('etapa').value=stage;renderRecords()};
$('nextStage').onclick=()=>{stage=stage>=18?1:stage+1;$('etapa').value=stage;renderRecords()};
$('situacao').addEventListener('change',e=>setSituation(e.target.value));
$('addReading').onclick=()=>{readings.push('');renderReadings()};
$('photoBtn').onclick=()=>$('photoInput').click();
$('photoInput').onchange=e=>addPhotos(e.target.files);
$('exportBtn').onclick=exportCSV;

$('saveBtn').onclick=()=>{
  const codigo=$('codigo').value.trim(),medidor=$('medidor').value.trim();
  const leituras=readings.map(x=>x.trim()).filter(Boolean);
  if(!codigo||!medidor||!leituras.length||!selectedSituacao){
    $('status').textContent='Preencha os campos obrigatórios: código, medidor, leitura e situação.';
    $('status').style.color='var(--red)';return;
  }
  entries.push({
    id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),
    codigo,medidor,leituras,situacao:selectedSituacao,etapa:stage,
    data:$('data').value||todayStr(),obs:$('obs').value.trim(),
    fotos:selectedFotos.slice(),resolvido:false,resolvidoEm:null,criadoEm:Date.now()
  });
  saveData();resetForm();renderRecords();
  $('status').textContent=`Registro salvo na Etapa ${stage}.`;
  $('status').style.color='var(--green)';
};
loadData();renderStages();renderReadings();$('data').value=todayStr();renderRecords();
</script>
</body>
</html>
